# job-tool settings. Copy to config.yaml and edit. (config.yaml is git-ignored.)

# How far back to look on company boards the first time (days). After that the
# database remembers what it has seen, so old jobs never come back.
workday_every_hours: 6       # Workday rate-limits hard; check those companies at most this often
lookback_days: 30

# Where things live (relative to the repo folder).
database: data/jobs.db
urls_file: urls.txt          # paste any job links here, one per line; `find` picks them up
resumes_dir: resumes          # your PDF variants go here (see resumes below)

# ---------------- what counts as a match ----------------
filters:
  title_include: [engineer, developer, programmer, swe]
  # Companies to ignore everywhere: job reposting sites, AI-training gig sites, and "training then placement"
  # programs that bind you to a contract. Matched as part of the company name, case-insensitive. Edit freely.
  company_exclude: [MeeBoss, RemoteHunter, Jobgether, HiredBuddy, TalentHop, Joblet, AfterQuery, Lensa,
                    BeaconFire, SynergisticIT, Revature, Smoothstack, mthree, Dice, Jooble, Talentify]
  title_exclude: [senior, sr, staff, principal, lead, manager, director, head, vp, architect,
    intern, internship, co-op, iii, iv, distinguished, fellow, mechanical, electrical, hardware,
    firmware, rf, optical, chemical, civil, manufacturing, sales, recruit, technician, field,
    quality, validation, analog, asic, fpga, silicon, thermal, structural, avp, assistant vice president, vice president, 'training material', sap, salesforce, servicenow, ts/sci, polygraph, poly]
  # "Engineer" titles must also contain one of these (so "Process Engineer" is skipped)
  engineer_needs_one_of: [software, 'full.?stack', 'front.?end', 'back.?end', web, application, platform,
    api, data, cloud, devops, infrastructure, ui, ux, mobile, ios, android, java, python, react,
    node, typescript, ai, ml, automation, integration, product, sde, swe]
  titles_ok_without_signal: [developer, programmer, swe]
  # Location: any of these words, or ", MA", or US remote
  places: [boston, cambridge, somerville, brookline, newton, watertown, medford, malden, quincy,
    everett, chelsea, waltham, burlington, woburn, lexington, needham, wellesley, bedford, dedham,
    braintree, lynn, salem, framingham, natick, marlborough, lowell, andover, wilmington, billerica,
    westborough, north reading, tewksbury, canton, norwood, maynard, chelmsford, acton, concord,
    beverly, danvers, peabody, reading, massachusetts]
  state_codes: [MA]
  remote_us_ok: true
  non_us_words: [canada, toronto, vancouver, uk, united kingdom, london, ireland, dublin, germany,
    berlin, france, paris, spain, portugal, poland, india, bangalore, bengaluru, hyderabad,
    singapore, japan, tokyo, australia, sydney, brazil, mexico, argentina, colombia, israel,
    netherlands, amsterdam, emea, apac, latam, europe, philippines, romania, czech, sweden,
    denmark, switzerland, china, korea]

# ---------------- which resume to attach ----------------
# At apply time the tool reads the posting text and scores each variant by how many of
# its keywords appear. Highest score wins; ties and zero scores go to `default`.
# Put the PDFs in resumes_dir. The file is uploaded as-is, so name them however you
# like here; the upload keeps the file name, so Evan-Roberts-Resume.pdf style is safest.
resumes:
  default: fullstack
  variants:
    fullstack:
      file: fullstack/Evan-Roberts-Resume.pdf
      keywords: [full stack, full-stack, fullstack, end-to-end, end to end]
    frontend:
      file: frontend/Evan-Roberts-Resume.pdf
      keywords: [frontend, front-end, front end, ui, ux, css, design system, figma, accessibility]
    backend:
      file: backend/Evan-Roberts-Resume.pdf
      keywords: [backend, back-end, back end, api, microservices, distributed, database, sql, java, spring]
    data:
      file: data/Evan-Roberts-Resume.pdf
      keywords: [data engineer, etl, pipeline, analytics, pandas, warehouse, spark, airflow, dbt]
    healthcare:
      file: healthcare/Evan-Roberts-Resume.pdf
      keywords: [healthcare, health care, patient, clinical, hipaa, provider, clinic, medical]
      weight: 2        # healthcare words count double, so health-tech companies get this one

# ---------------- browser ----------------
apply:
  batch_size: 5             # how many applications to open and fill per run
  browser: chrome           # chrome = your installed Google Chrome; chromium = Playwright's own
  slow_mo_ms: 0             # raise (e.g. 50) only if a site chokes on fast typing

# ---------------- company boards ----------------
# ---- other sources (no account needed, no AI) ----
sources:
  builtin:
    enabled: true
    headless: true          # set false if Built In starts showing a "verify you are human" page
    max_pages: 3
    pages:
      - https://www.builtinboston.com/jobs/dev-engineering/entry-level
      - https://www.builtinboston.com/jobs/dev-engineering/junior
      - https://www.builtinboston.com/jobs/dev-engineering/mid-level
  hiringcafe:
    enabled: true           # hiring.cafe collects jobs straight from company career pages
    headless: false         # visible window: hiring.cafe blocks hidden browsers
    scrolls: 6              # each scroll loads ~40 more results
    # Best: set up a search on hiring.cafe yourself (location, seniority, date), copy the URL from the
    # address bar, and paste it here. These starters search the last 4 days, entry to mid level:
    searches:
      - "https://hiring.cafe/?searchState=%7B%22dateFetchedPastNDays%22%3A4%2C%22seniorityLevel%22%3A%5B%22No%20Prior%20Experience%20Required%22%2C%22Entry%20Level%22%2C%22Mid%20Level%22%5D%2C%22searchQuery%22%3A%22software%20engineer%20boston%22%7D"
      - "https://hiring.cafe/?searchState=%7B%22dateFetchedPastNDays%22%3A4%2C%22seniorityLevel%22%3A%5B%22No%20Prior%20Experience%20Required%22%2C%22Entry%20Level%22%2C%22Mid%20Level%22%5D%2C%22searchQuery%22%3A%22full%20stack%20engineer%20boston%22%7D"
      - "https://hiring.cafe/?searchState=%7B%22dateFetchedPastNDays%22%3A4%2C%22seniorityLevel%22%3A%5B%22No%20Prior%20Experience%20Required%22%2C%22Entry%20Level%22%2C%22Mid%20Level%22%5D%2C%22searchQuery%22%3A%22software%20engineer%22%2C%22workplaceTypes%22%3A%5B%22Remote%22%5D%7D"
  wellfound:
    enabled: true           # opens a visible window; log in to Wellfound once and it remembers you
    scrolls: 8
    # Wellfound shows jobs matching the role/location preferences in your Wellfound profile.
    # Optional: specific pages, e.g. https://wellfound.com/role/l/software-engineer/boston
    pages: [https://wellfound.com/jobs]
  linkedin:
    enabled: true           # LinkedIn's public (logged-out) search: your account is never used
    past: auto              # auto = back to your last LinkedIn run (so days off aren't missed) | day | week | month
    experience: [2, 3]      # 1 internship, 2 entry level, 3 associate, 4 mid-senior
    max_results_per_search: 50   # results come newest first; 50 covers a day or two
    pause_seconds: 8        # seconds between LinkedIn requests (plus a random extra). Raise if you see lots of 429s
    resolve_apply_links: false  # true = 1 extra request per job to find its company link (more throttling).
                                # Not needed: apply --easy sorts Easy Apply vs company-site jobs while you're signed in.
    # Each search costs LinkedIn requests (and throttling). These four cover nearly everything; frontend /
    # backend / web developer searches mostly re-found the same jobs, so they were dropped.
    searches:
      - {keywords: "software engineer", location: "Boston, Massachusetts, United States", distance: 25}
      - {keywords: "full stack engineer", location: "Boston, Massachusetts, United States", distance: 25}
      - {keywords: "junior software engineer", location: "United States", remote: true}
      - {keywords: "software engineer I", location: "United States", remote: true}

